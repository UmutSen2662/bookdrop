[package]
name = "bookdrop"
version = "1.1.0"
description = "Drop your ebooks in. Get one organized library with clean metadata and a reading log."
authors = ["Umut Sen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bookdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
sha2 = "0.11.1"
base64 = "0.22"
image = "0.25.10"
# Direct cover downloads. rustls: no OpenSSL needed on Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-single-instance = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
